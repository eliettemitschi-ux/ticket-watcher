name: Add any event (best effort)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Event page URL (any site)'
        required: true
      name:
        description: 'Display name'
        required: true
      venue:
        description: 'Venue name (optional)'
        required: false
      timeFilter:
        description: 'Only notify for a specific time, e.g. "8.30pm" (optional -- leave blank to be notified for any date/time)'
        required: false

# Shared with check.yml and add-barbican-event.yml -- all three commit
# to the same repo, and running them concurrently risks a push race.
concurrency:
  group: ticket-watcher-repo-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EVENTS_FILE_PATH: docs/events.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Discover, verify, and add (best effort)
        run: node scripts/add-any-event.js "${{ inputs.url }}" "${{ inputs.name }}" "${{ inputs.venue }}" "${{ inputs.timeFilter }}"

      - name: Commit
        run: |
          git config user.name "ticket-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/events.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: add event via workflow"
          # -X ours: see check.yml's comment on the same line -- this is a
          # machine-generated file, "most recent write wins" on a rare
          # conflict is safe here, nothing manual to lose.
          git pull --rebase -X ours origin "$GITHUB_REF_NAME"
          git push
