name: Check events

on:
  schedule:
    # This is a BACKUP only, not the primary trigger -- GitHub's own
    # `schedule:` trigger is documented as best-effort and was observed
    # live (2026-09-22) firing every 11-17 minutes instead of the
    # requested 5, a real platform limitation, not something fixable by
    # tuning this file. The actual 5-minute cadence comes from
    # cron-worker/ (a small, free Cloudflare Worker with a real Cron
    # Trigger) calling this workflow's `workflow_dispatch` via GitHub's
    # API every 5 minutes -- API-triggered runs start immediately,
    # without GitHub's scheduling deprioritization. This hourly backup
    # only matters if the Worker/Cloudflare account itself ever has a
    # problem -- see HANDOFF.md.
    - cron: '0 * * * *'
  workflow_dispatch: {}

# Shared with add-barbican-event.yml too -- both commit to the same repo,
# and running them concurrently risks a push race between the two. Queue
# rather than cancel, so a manually-triggered "add event" run never gets
# silently dropped by an overlapping scheduled check.
concurrency:
  group: ticket-watcher-repo-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Comfortably above the worst-case seen in practice (Bob Dylan's
    # queue-it-gated browser check alone can take ~100s with its own
    # internal retry) plus Playwright/dependency setup time.
    timeout-minutes: 8
    env:
      # Same store.js code as the local pm2 deployment, just pointed at
      # docs/ -- see store.js's own comment on EVENTS_FILE_PATH for why:
      # this makes the one file the checker writes the SAME file GitHub
      # Pages serves as the dashboard's data, no separate copy step.
      EVENTS_FILE_PATH: docs/events.json
      NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      # Tags every push from this deployment "[GitHub]" so it's obvious
      # which system sent it during the overlap with the local pm2
      # deployment (tagged "[Laptop]") -- see HANDOFF.md. Remove once
      # the local setup is retired, if you like, though it's harmless
      # to leave permanently too.
      NOTIFY_SOURCE_TAG: GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Only caches the browser BINARY download (the larger, slower part
      # of "playwright install") -- the OS-level shared libraries
      # (--with-deps) still install fresh every run since GitHub Actions
      # runners are a clean VM each time, so this step still runs
      # regardless of cache status; it just skips re-downloading Chromium
      # itself when the cache hits.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run checks
        run: node check.js

      - name: Write status.json (the static dashboard's equivalent of /api/status)
        run: |
          node -e "
            const fs = require('fs');
            fs.writeFileSync('docs/status.json', JSON.stringify({
              pollIntervalMinutes: 5,
              ntfy: process.env.NTFY_TOPIC
                ? { topic: process.env.NTFY_TOPIC, server: process.env.NTFY_SERVER || 'https://ntfy.sh' }
                : null,
            }, null, 2));
          "

      - name: Commit updated data
        run: |
          git config user.name "ticket-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/events.json docs/status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update event data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
